<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página inicial</title>
    <meta name="author" content="Henrique P">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="img/logo.jpg" alt="Logo do site" width="50" height="50">
        <nav class="nav-meio">
            <ul>
                <li><a href="#paises">Paises</a> </li>
                <li><a href="#eu">Quem sou eu </a> </li>

        </div>
    </header>

    <section class="carrossel">
        <div class="carousel-img">
            <img src="img/foto1.jpg" alt="1a Foto do carrosel" >
            <img src="img/foto2.jpg" alt="2a Foto do carrosel" >
            <img src="img/foto3.jpg" alt="3a Foto do carrosel" >
        </div>

        <div class="search">
            <span class="lupinha">⌕</span>
            <input type="text" placeholder="Pesquisar por país" >
        </div>
    </section>

    <main class="container">
        <div class="card1">            
            <div class="titulo1">
                Nome de uma experiencia "PRINCIPAL"
            </div>
            <div class="conteudo1">
                <div class="box1">
                     <img src="img/foto2.jpg" alt="Foto da experiencia" >
                </div>
                <div class="box-descricao">
                    Pequena descricao
                </div>                
            </div>
        </div>

        <div class="card2">            
            <div class="titulo2">
                Nome de uma experiencia "PRINCIPAL"
            </div>
            <div class="conteudo2">
                <div class="box2">
                     <img src="img/foto3.jpg" alt="Foto da experiencia" >
                </div>
                <div class="box-descricao">
                    Pequena descricao
                </div>                
            </div>
        </div>
